def compareReleaseVersions = { String left, String right ->
    List<Integer> leftParts = left.tokenize(".").collect { Integer.parseInt(it) }
    List<Integer> rightParts = right.tokenize(".").collect { Integer.parseInt(it) }
    (leftParts[0] <=> rightParts[0])
        ?: (leftParts[1] <=> rightParts[1])
        ?: (leftParts[2] <=> rightParts[2])
}
String canonicalProductVersion = versionFile.asFile.getText("UTF-8").trim()
if (!(canonicalProductVersion ==~ /\d{4}\.\d+\.\d+/)) {
    throw new GradleException("VERSION must use the FRC release form YYYY.MAJOR.PATCH")
}
String releaseCandidateVersion = providers.gradleProperty("cyberPowerReleaseVersion").orNull
if (releaseCandidateVersion != null) {
    releaseCandidateVersion = releaseCandidateVersion.trim()
    if (!(releaseCandidateVersion ==~ /\d{4}\.\d+\.\d+/)) {
        throw new GradleException(
            "cyberPowerReleaseVersion must use the FRC release form YYYY.MAJOR.PATCH",
        )
    }
    if (compareReleaseVersions(releaseCandidateVersion, canonicalProductVersion) <= 0) {
        throw new GradleException(
            "cyberPowerReleaseVersion ${releaseCandidateVersion} must be newer than "
                + "canonical VERSION ${canonicalProductVersion}",
        )
    }
}
version = releaseCandidateVersion ?: canonicalProductVersion

def loadImmutableArtifacts = {
    File hashesFile = immutableArtifactHashesFile.asFile
    if (!hashesFile.isFile()) {
        throw new GradleException("Missing immutable artifact manifest: ${hashesFile}")
    }
    def manifest = new JsonSlurper().parse(hashesFile)
    if (manifest.schemaVersion != 1 || !(manifest.artifacts instanceof Map)) {
        throw new GradleException("Invalid immutable artifact manifest: ${hashesFile}")
    }
    Map<String, String> hashes = new LinkedHashMap<>()
    manifest.artifacts.each { relativePath, sha256 ->
        if (!(relativePath instanceof String)
            || !(relativePath ==~ /[A-Za-z0-9._\/-]+/)
            || relativePath.contains("//")
            || relativePath.contains("../")
            || !(sha256 instanceof String)
            || !(sha256 ==~ /[0-9a-f]{64}/)) {
            throw new GradleException("Invalid immutable artifact entry: ${relativePath}")
        }
        hashes.put(relativePath, sha256)
    }
    if (hashes.isEmpty()) {
        throw new GradleException("Immutable artifact manifest must not be empty")
    }
    return hashes
}
def immutableArtifacts = loadImmutableArtifacts()
def forbiddenV1ClassEntries = [
    "com/nextinnovation/cyberpower/EnergyMotor.class",
    "com/nextinnovation/cyberpower/EnergySupplyLoad.class",
    'com/nextinnovation/cyberpower/EnergySubsystem$V1Aggregate.class',
]
def forbiddenV1ClassMarkers = [
    "registerRobotSource",
    "v1EnergyPath",
    "V1Aggregate",
    "BatteryVoltageVolt",
    "TotalCurrentAmp",
    "PowerWatt",
    "EnergyJoule",
]

def rejectKnownV1Versions = { Collection<String> versions ->
    Set<String> blockedVersions = versions.intersect(blockedV1WriterVersions)
    if (!blockedVersions.isEmpty()) {
        throw new GradleException(
            "Published Maven repository contains blocked EnergyLogger V1 writer version(s): "
                + blockedVersions.sort().join(", "),
        )
    }
}

def assertV2OnlyArtifact = { File artifact ->
    if (!artifact.isFile() || artifact.length() == 0) {
        throw new GradleException("Missing or empty published runtime artifact: ${artifact}")
    }
    try (ZipFile archive = new ZipFile(artifact)) {
        Enumeration<? extends ZipEntry> entries = archive.entries()
        while (entries.hasMoreElements()) {
            ZipEntry entry = entries.nextElement()
            if (entry.isDirectory() || !entry.name.endsWith(".class")) {
                continue
            }
            if (forbiddenV1ClassEntries.contains(entry.name)) {
                throw new GradleException(
                    "Published artifact ${artifact.name} contains V1 writer API ${entry.name}",
                )
            }
            String classBytes = new String(
                archive.getInputStream(entry).readAllBytes(),
                StandardCharsets.ISO_8859_1,
            )
            String marker = forbiddenV1ClassMarkers.find { classBytes.contains(it) }
            if (marker != null) {
                throw new GradleException(
                    "Published artifact ${artifact.name} contains V1 writer marker '${marker}' "
                        + "in ${entry.name}",
                )
            }
        }
    } catch (IOException error) {
        throw new GradleException("Unable to inspect published artifact ${artifact}", error)
    }
}

def digest = { File file, String algorithm ->
    MessageDigest.getInstance(algorithm)
        .digest(file.bytes)
        .encodeHex()
        .toString()
}
def sha256 = { File file -> digest(file, "SHA-256") }

def assertArtifactVersionIdentity = { File artifact, String expectedVersion ->
    try (JarFile archive = new JarFile(artifact)) {
        String implementationVersion = archive.manifest
            ?.mainAttributes
            ?.getValue("Implementation-Version")
        if (implementationVersion != expectedVersion) {
            throw new GradleException(
                "Invalid JAR Implementation-Version for ${artifact.name}: "
                    + "expected ${expectedVersion}, received ${implementationVersion}",
            )
        }
        String moduleName = archive.manifest
            ?.mainAttributes
            ?.getValue("Automatic-Module-Name")
        if (moduleName != "com.nextinnovation.cyberpower") {
            throw new GradleException(
                "Invalid Automatic-Module-Name for ${artifact.name}: ${moduleName}",
            )
        }

        ZipEntry versionResource = archive.getEntry("META-INF/cyber-power-version.txt")
        if (versionResource != null) {
            String resourceVersion = new String(
                archive.getInputStream(versionResource).readAllBytes(),
                StandardCharsets.UTF_8,
            ).trim()
            if (resourceVersion != expectedVersion) {
                throw new GradleException(
                    "Invalid embedded libraryVersion for ${artifact.name}: "
                        + "expected ${expectedVersion}, received ${resourceVersion}",
                )
            }
        } else {
            // 2026.2.0-2026.2.2 predate the generated version resource. Their immutable
            // EnergyLogger class contains the exact fallback string instead.
            ZipEntry loggerClass = archive.getEntry(
                "com/nextinnovation/cyberpower/EnergyLogger.class",
            )
            if (loggerClass == null) {
                throw new GradleException("Missing EnergyLogger.class in ${artifact.name}")
            }
            String classBytes = new String(
                archive.getInputStream(loggerClass).readAllBytes(),
                StandardCharsets.ISO_8859_1,
            )
            if (!classBytes.contains(expectedVersion)) {
                throw new GradleException(
                    "Published ${artifact.name} cannot report libraryVersion ${expectedVersion}",
                )
            }
        }
    } catch (IOException error) {
        throw new GradleException("Unable to inspect published artifact ${artifact}", error)
    }
}

def checksumAlgorithms = [
    md5: "MD5",
    sha1: "SHA-1",
    sha256: "SHA-256",
    sha512: "SHA-512",
]

def assertChecksumSidecars = { File file ->
    checksumAlgorithms.each { extension, algorithm ->
        File sidecar = new File(file.parentFile, "${file.name}.${extension}")
        if (!sidecar.isFile()) {
            throw new GradleException("Missing ${algorithm} sidecar: ${sidecar}")
        }
        String expectedDigest = sidecar.getText("UTF-8").trim().toLowerCase(Locale.ROOT)
        String actualDigest = digest(file, algorithm)
        if (expectedDigest != actualDigest) {
            throw new GradleException(
                "Invalid ${algorithm} sidecar for ${file.name}: expected ${expectedDigest}, "
                    + "received ${actualDigest}",
            )
        }
    }
}

def assertPublishedVersionFiles = { File repositoryDirectory, String artifactVersion ->
    File versionDirectory = new File(
        repositoryDirectory,
        "${project.group.toString().replace('.', '/')}/${artifactName}/${artifactVersion}",
    )
    List<String> primaryFileNames = [
        "${artifactName}-${artifactVersion}.jar",
        "${artifactName}-${artifactVersion}-sources.jar",
        "${artifactName}-${artifactVersion}-javadoc.jar",
        "${artifactName}-${artifactVersion}.pom",
        "${artifactName}-${artifactVersion}.module",
    ]
    Set<String> expectedFileNames = new LinkedHashSet<>(primaryFileNames)
    primaryFileNames.each { fileName ->
        checksumAlgorithms.keySet().each { extension ->
            expectedFileNames.add("${fileName}.${extension}")
        }
    }
    Set<String> actualFileNames = (versionDirectory.listFiles()
        ?.findAll { it.isFile() }
        ?.collect { it.name } ?: []) as Set
    if (actualFileNames != expectedFileNames) {
        throw new GradleException(
            "Maven version directory ${artifactVersion} has missing or unexpected files; "
                + "expected ${expectedFileNames.sort()}, received ${actualFileNames.sort()}",
        )
    }
    primaryFileNames.each { fileName ->
        File publishedFile = new File(versionDirectory, fileName)
        if (!publishedFile.isFile() || publishedFile.length() == 0) {
            throw new GradleException("Missing or empty Maven artifact: ${publishedFile}")
        }
        assertChecksumSidecars(publishedFile)
    }

    File runtimeArtifact = new File(
        versionDirectory,
        "${artifactName}-${artifactVersion}.jar",
    )
    assertV2OnlyArtifact(runtimeArtifact)
    assertArtifactVersionIdentity(runtimeArtifact, artifactVersion)

    def pom = new XmlSlurper(false, false).parse(
        new File(versionDirectory, "${artifactName}-${artifactVersion}.pom"),
    )
    if (pom.groupId.text() != project.group.toString()
        || pom.artifactId.text() != artifactName
        || pom.version.text() != artifactVersion) {
        throw new GradleException("POM coordinate does not match ${artifactVersion}")
    }

    def module = new JsonSlurper().parse(
        new File(versionDirectory, "${artifactName}-${artifactVersion}.module"),
    )
    if (module.component != [
        group: project.group.toString(),
        module: artifactName,
        version: artifactVersion,
        attributes: ["org.gradle.status": "release"],
    ]) {
        throw new GradleException("Gradle module coordinate does not match ${artifactVersion}")
    }
}

def assertImmutableArtifacts = { File repositoryDirectory ->
    immutableArtifacts.each { relativePath, expectedSha256 ->
        File artifact = new File(repositoryDirectory, relativePath)
        if (!artifact.isFile()) {
            throw new GradleException("Missing immutable historical artifact: ${artifact}")
        }
        String actualSha256 = sha256(artifact)
        if (actualSha256 != expectedSha256) {
            throw new GradleException(
                "Immutable historical artifact changed: ${relativePath}; "
                    + "expected ${expectedSha256}, received ${actualSha256}",
            )
        }
    }
}

def validatePublishedV2Repository = { File repositoryDirectory ->
    assertImmutableArtifacts(repositoryDirectory)
    String artifactRelativeDirectory =
        "${project.group.toString().replace('.', '/')}/${artifactName}"
    File artifactDirectory = new File(
        repositoryDirectory,
        artifactRelativeDirectory,
    )
    File metadataFile = new File(artifactDirectory, "maven-metadata.xml")
    if (!metadataFile.isFile()) {
        throw new GradleException("Missing Maven metadata: ${metadataFile}")
    }
    assertChecksumSidecars(metadataFile)
    Set<String> expectedMetadataFileNames = ["maven-metadata.xml"] as Set
    checksumAlgorithms.keySet().each { extension ->
        expectedMetadataFileNames.add("maven-metadata.xml.${extension}")
    }
    Set<String> actualMetadataFileNames = (artifactDirectory.listFiles()
        ?.findAll { it.isFile() }
        ?.collect { it.name } ?: []) as Set
    if (actualMetadataFileNames != expectedMetadataFileNames) {
        throw new GradleException(
            "Maven artifact root has missing or unexpected files; expected "
                + "${expectedMetadataFileNames.sort()}, received ${actualMetadataFileNames.sort()}",
        )
    }

    def metadata = new XmlSlurper(false, false).parse(metadataFile)
    if (metadata.groupId.text() != project.group.toString()
        || metadata.artifactId.text() != artifactName) {
        throw new GradleException(
            "Maven metadata coordinate must be ${project.group}:${artifactName}",
        )
    }
    List<String> metadataVersionList = metadata.versioning.versions.version.collect { it.text() }
    Set<String> metadataVersions = metadataVersionList as Set
    if (metadataVersions.isEmpty()) {
        throw new GradleException("Maven metadata must publish at least one V2 writer version")
    }
    if (metadataVersionList.size() != metadataVersions.size()
        || !metadataVersions.every { it ==~ /\d{4}\.\d+\.\d+/ }) {
        throw new GradleException("Maven metadata contains duplicate or malformed versions")
    }
    List<File> versionDirectories = artifactDirectory.listFiles()?.findAll { it.isDirectory() } ?: []
    Set<String> versionDirectoryNames = versionDirectories.collect { it.name } as Set

    Set<String> immutableVersions = new LinkedHashSet<>()
    immutableArtifacts.keySet().each { relativePath ->
        String prefix = "${artifactRelativeDirectory}/"
        if (!relativePath.startsWith(prefix)) {
            throw new GradleException(
                "Immutable artifact is outside the Cyber Power Maven coordinate: ${relativePath}",
            )
        }
        String versionAndFile = relativePath.substring(prefix.length())
        int separatorIndex = versionAndFile.indexOf('/')
        if (separatorIndex <= 0
            || separatorIndex != versionAndFile.lastIndexOf('/')
            || separatorIndex == versionAndFile.length() - 1) {
            throw new GradleException("Invalid immutable Maven artifact path: ${relativePath}")
        }
        String recordedVersion = versionAndFile.substring(0, separatorIndex)
        if (!(recordedVersion ==~ /\d{4}\.\d+\.\d+/)) {
            throw new GradleException("Invalid immutable artifact version: ${relativePath}")
        }
        immutableVersions.add(recordedVersion)
    }

    rejectKnownV1Versions(
        metadataVersions
            + [metadata.versioning.latest.text(), metadata.versioning.release.text()]
            + versionDirectoryNames
            + immutableVersions,
    )
    if (metadataVersions != versionDirectoryNames || metadataVersions != immutableVersions) {
        throw new GradleException(
            "Maven metadata, version directories, and immutable manifest must contain "
                + "the same versions; metadata=${metadataVersions.sort()}, "
                + "directories=${versionDirectoryNames.sort()}, "
                + "immutable=${immutableVersions.sort()}",
        )
    }

    String highestVersion = metadataVersions.max(compareReleaseVersions)
    if (metadata.versioning.latest.text() != highestVersion
        || metadata.versioning.release.text() != highestVersion
        || canonicalProductVersion != highestVersion) {
        throw new GradleException(
            "Maven latest, release, and canonical VERSION must all equal highest version "
                + highestVersion,
        )
    }

    metadataVersions.each { artifactVersion ->
        String versionPrefix = "${artifactRelativeDirectory}/${artifactVersion}/"
        Set<String> recordedFileNames = immutableArtifacts.keySet()
            .findAll { it.startsWith(versionPrefix) }
            .collect { it.substring(versionPrefix.length()) } as Set
        File versionDirectory = new File(artifactDirectory, artifactVersion)
        Set<String> actualFileNames = (versionDirectory.listFiles()
            ?.findAll { it.isFile() }
            ?.collect { it.name } ?: []) as Set
        if (recordedFileNames != actualFileNames) {
            throw new GradleException(
                "Immutable manifest does not exactly cover Maven ${artifactVersion}; "
                    + "recorded=${recordedFileNames.sort()}, actual=${actualFileNames.sort()}",
            )
        }
        assertPublishedVersionFiles(repositoryDirectory, artifactVersion)
    }
    return metadataVersions
}

def assertVersionUnpublished = { File repositoryDirectory, String artifactVersion ->
    String relativeVersionDirectory =
        "${project.group.toString().replace('.', '/')}/${artifactName}/${artifactVersion}"
    File versionDirectory = new File(repositoryDirectory, relativeVersionDirectory)
    File metadataFile = new File(
        repositoryDirectory,
        "${project.group.toString().replace('.', '/')}/${artifactName}/maven-metadata.xml",
    )
    Set<String> metadataVersions = metadataFile.isFile()
        ? new XmlSlurper(false, false)
            .parse(metadataFile)
            .versioning
            .versions
            .version
            .collect { it.text() } as Set
        : [] as Set
    boolean recordedImmutable = immutableArtifacts.keySet().any {
        it.startsWith("${relativeVersionDirectory}/")
    }
    if (versionDirectory.exists() || metadataVersions.contains(artifactVersion) || recordedImmutable) {
        throw new GradleException(
            "Cyber Power ${artifactVersion} is already published and immutable; "
                + "bump VERSION before preparing another release",
        )
    }
}

def validateReleaseCandidateRepository = { File repositoryDirectory ->
    File artifactDirectory = new File(
        repositoryDirectory,
        "${project.group.toString().replace('.', '/')}/${artifactName}",
    )
    File metadataFile = new File(artifactDirectory, "maven-metadata.xml")
    if (!metadataFile.isFile()) {
        throw new GradleException("Missing staged Maven metadata: ${metadataFile}")
    }
    assertChecksumSidecars(metadataFile)
    Set<String> expectedMetadataFileNames = ["maven-metadata.xml"] as Set
    checksumAlgorithms.keySet().each { extension ->
        expectedMetadataFileNames.add("maven-metadata.xml.${extension}")
    }
    Set<String> actualMetadataFileNames = (artifactDirectory.listFiles()
        ?.findAll { it.isFile() }
        ?.collect { it.name } ?: []) as Set
    if (actualMetadataFileNames != expectedMetadataFileNames) {
        throw new GradleException("Release staging contains unexpected Maven metadata files")
    }
    def metadata = new XmlSlurper(false, false).parse(metadataFile)
    if (metadata.groupId.text() != project.group.toString()
        || metadata.artifactId.text() != artifactName) {
        throw new GradleException(
            "Staged Maven metadata coordinate must be ${project.group}:${artifactName}",
        )
    }
    Set<String> stagedVersions = metadata.versioning.versions.version.collect { it.text() } as Set
    if (stagedVersions != ([project.version.toString()] as Set)
        || metadata.versioning.latest.text() != project.version.toString()
        || metadata.versioning.release.text() != project.version.toString()) {
        throw new GradleException(
            "Release staging must contain only Cyber Power ${project.version}",
        )
    }
    rejectKnownV1Versions(stagedVersions)
    Set<String> stagedDirectories = (artifactDirectory.listFiles()
        ?.findAll { it.isDirectory() }
        ?.collect { it.name } ?: []) as Set
    if (stagedDirectories != stagedVersions) {
        throw new GradleException("Release staging directories do not match Maven metadata")
    }
    assertPublishedVersionFiles(repositoryDirectory, project.version.toString())
}

