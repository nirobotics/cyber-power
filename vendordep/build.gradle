tasks.register("validateVendordepJson") {
    group = "verification"
    description = "Validates the published V2-only descriptor and Maven repository."
    inputs.file(versionFile)
    inputs.file(immutableArtifactHashesFile)
    inputs.file(vendordepFile)
    inputs.dir(vendordepMavenDirectory)

    doLast {
        File descriptor = vendordepFile.asFile
        if (!descriptor.isFile()) {
            throw new GradleException("Missing vendordep descriptor: ${descriptor}")
        }

        def json = new JsonSlurper().parse(descriptor)
        def expected = [
            fileName: "CyberPower.json",
            name: "Cyber Power",
            version: canonicalProductVersion,
            uuid: "82ed958d-ee21-437a-90e5-dfa702a2de63",
            frcYear: "2026",
            jsonUrl: "https://power.team8214.com/vendordep/CyberPower.json",
        ]
        expected.each { key, value ->
            if (json[key] != value) {
                throw new GradleException("Invalid ${key}: expected '${value}', received '${json[key]}'")
            }
        }

        if (json.mavenUrls != ["https://power.team8214.com/vendordep/maven"]) {
            throw new GradleException("mavenUrls must contain only the production Cyber Power Maven repository")
        }
        if (json.javaDependencies != [[
            groupId: project.group.toString(),
            artifactId: artifactName,
            version: canonicalProductVersion,
        ]]) {
            throw new GradleException("javaDependencies does not match the published Maven coordinate")
        }
        if (json.jniDependencies != [] || json.cppDependencies != []) {
            throw new GradleException("Cyber Power is Java-only; JNI and C++ dependency arrays must be empty")
        }

        Set<String> publishedVersions = validatePublishedV2Repository(vendordepMavenDirectory.asFile)
        if (!publishedVersions.contains(canonicalProductVersion)) {
            throw new GradleException(
                "Published Maven repository does not contain current V2 writer "
                    + canonicalProductVersion,
            )
        }
        File metadataFile = new File(
            vendordepMavenDirectory.asFile,
            "${project.group.toString().replace('.', '/')}/${artifactName}/maven-metadata.xml",
        )
        def metadata = new XmlSlurper(false, false).parse(metadataFile)
        if (metadata.versioning.latest.text() != canonicalProductVersion
            || metadata.versioning.release.text() != canonicalProductVersion) {
            throw new GradleException(
                "Maven latest/release must both equal canonical VERSION "
                    + canonicalProductVersion,
            )
        }
    }
}

tasks.register("testVendordepReleaseGate") {
    group = "verification"
    description = "Tests that the release gate allows V2 history and rejects V1 writers."
    outputs.upToDateWhen { false }

    doLast {
        project.delete(temporaryDir)
        temporaryDir.mkdirs()
        def fixtureJar = { String entryName, String content ->
            File artifact = new File(temporaryDir, "${UUID.randomUUID()}.jar")
            try (ZipOutputStream archive = new ZipOutputStream(artifact.newOutputStream())) {
                archive.putNextEntry(new ZipEntry(entryName))
                archive.write(content.getBytes(StandardCharsets.ISO_8859_1))
                archive.closeEntry()
            }
            return artifact
        }
        def expectRejection = { String expectedMessage, Closure validation ->
            try {
                validation()
            } catch (GradleException error) {
                if (!error.message.contains(expectedMessage)) {
                    throw new GradleException(
                        "Release gate failed for the wrong reason: ${error.message}",
                        error,
                    )
                }
                return
            }
            throw new GradleException(
                "Release gate accepted a fixture containing '${expectedMessage}'",
            )
        }

        rejectKnownV1Versions(["2026.2.0", "2026.2.1", "2026.2.2"])
        blockedV1WriterVersions.each { blockedVersion ->
            expectRejection(blockedVersion) {
                rejectKnownV1Versions([blockedVersion, "2026.2.0"])
            }
        }

        assertV2OnlyArtifact(fixtureJar(
            "com/nextinnovation/cyberpower/EnergyLogger.class",
            "V2-only",
        ))
        expectRejection("EnergyMotor.class") {
            assertV2OnlyArtifact(fixtureJar(
                "com/nextinnovation/cyberpower/EnergyMotor.class",
                "relabeled V1 writer",
            ))
        }
        expectRejection("EnergyJoule") {
            assertV2OnlyArtifact(fixtureJar(
                "com/nextinnovation/cyberpower/EnergyLogger.class",
                "TotalEnergyJoule",
            ))
        }

        File unpublishedRepository = new File(temporaryDir, "unpublished-repository")
        unpublishedRepository.mkdirs()
        assertVersionUnpublished(unpublishedRepository, "2099.1.0")
        File existingVersion = new File(
            unpublishedRepository,
            "com/nextinnovation/cyberpower/${artifactName}/2099.1.0",
        )
        existingVersion.mkdirs()
        expectRejection("already published and immutable") {
            assertVersionUnpublished(unpublishedRepository, "2099.1.0")
        }

        File immutableRepositoryFixture = new File(temporaryDir, "immutable-repository")
        copy {
            from vendordepMavenDirectory
            into immutableRepositoryFixture
        }
        validatePublishedV2Repository(immutableRepositoryFixture)
        File unexpectedFile = new File(
            immutableRepositoryFixture,
            "com/nextinnovation/cyberpower/${artifactName}/2026.2.2/unexpected.txt",
        )
        unexpectedFile.setText("unexpected", "UTF-8")
        expectRejection("does not exactly cover") {
            validatePublishedV2Repository(immutableRepositoryFixture)
        }
        if (!unexpectedFile.delete()) {
            throw new GradleException("Unable to reset immutable release-gate fixture")
        }
        File tamperedRuntime = new File(
            immutableRepositoryFixture,
            "com/nextinnovation/cyberpower/${artifactName}/2026.2.2/"
                + "${artifactName}-2026.2.2.jar",
        )
        tamperedRuntime.append("tampered", "UTF-8")
        expectRejection("Immutable historical artifact changed") {
            validatePublishedV2Repository(immutableRepositoryFixture)
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("validateVendordepJson")
    dependsOn tasks.named("testVendordepReleaseGate")
}

tasks.register("verifyPublishedVendordep") {
    group = "verification"
    description = "Read-only verification of the committed descriptor and Maven repository."
    dependsOn tasks.named("validateVendordepJson")

    doLast {
        logger.lifecycle(
            "Verified immutable Cyber Power {} at {} without publishing or modifying it.",
            canonicalProductVersion,
            vendordepMavenDirectory.asFile,
        )
    }
}

def assertVendordepVersionUnpublished = tasks.register("assertVendordepVersionUnpublished") {
    group = "release"
    description = "Refuses to prepare a VERSION that already exists in the public repository."
    inputs.file(versionFile)
    inputs.file(immutableArtifactHashesFile)
    inputs.dir(vendordepMavenDirectory)
    outputs.upToDateWhen { false }

    doLast {
        assertVersionUnpublished(vendordepMavenDirectory.asFile, project.version.toString())
    }
}

def cleanVendordepReleaseStaging = tasks.register(
    "cleanVendordepReleaseStaging",
    Delete,
) {
    group = "release"
    description = "Removes only the temporary vendordep release staging directory."
    delete releaseStagingDirectory
}

tasks.named("publishCyberPowerPublicationToReleaseStagingRepository") {
    dependsOn assertVendordepVersionUnpublished
    dependsOn cleanVendordepReleaseStaging
}

tasks.register("prepareVendordepRelease") {
    group = "release"
    description = "Builds and validates a new VERSION in build/release-staging without touching public/."
    dependsOn "publishCyberPowerPublicationToReleaseStagingRepository"
    inputs.file(versionFile)
    inputs.file(vendordepFile)
    inputs.property("cyberPowerVersion", project.version.toString())
    outputs.upToDateWhen { false }

    doLast {
        File sourceDescriptor = vendordepFile.asFile
        if (!sourceDescriptor.isFile()) {
            throw new GradleException("Missing vendordep descriptor: ${sourceDescriptor}")
        }
        def descriptor = new JsonSlurper().parse(sourceDescriptor)
        if (descriptor.version != canonicalProductVersion
            || descriptor.javaDependencies != [[
                groupId: project.group.toString(),
                artifactId: artifactName,
                version: canonicalProductVersion,
            ]]) {
            throw new GradleException(
                "Source CyberPower.json must target canonical VERSION "
                    + canonicalProductVersion,
            )
        }
        validateReleaseCandidateRepository(releaseStagingMavenDirectory.get().asFile)
        descriptor.version = project.version.toString()
        descriptor.javaDependencies[0].version = project.version.toString()
        File stagedDescriptor = releaseStagingDirectory.get().file("CyberPower.json").asFile
        stagedDescriptor.parentFile.mkdirs()
        stagedDescriptor.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson(descriptor)) + "\n",
            "UTF-8",
        )
        def stagedJson = new JsonSlurper().parse(stagedDescriptor)
        if (stagedJson.version != project.version.toString()
            || stagedJson.javaDependencies != [[
                groupId: project.group.toString(),
                artifactId: artifactName,
                version: project.version.toString(),
            ]]) {
            throw new GradleException(
                "Staged CyberPower.json does not target candidate VERSION ${project.version}",
            )
        }
        logger.lifecycle(
            "Prepared immutable Cyber Power {} candidate at {}.",
            project.version,
            releaseStagingDirectory.get().asFile,
        )
    }
}

gradle.taskGraph.whenReady { graph ->
    if (releaseCandidateVersion != null) {
        if (!graph.hasTask(":prepareVendordepRelease")) {
            throw new GradleException(
                "cyberPowerReleaseVersion is isolated to prepareVendordepRelease",
            )
        }
        String forbiddenTask = [
            "check",
            "validateVendordepJson",
            "verifyPublishedVendordep",
        ].find { graph.hasTask(":${it}") }
        if (forbiddenTask != null) {
            throw new GradleException(
                "${forbiddenTask} always validates canonical VERSION "
                    + "${canonicalProductVersion}; do not combine it with "
                    + "cyberPowerReleaseVersion",
            )
        }
    }
}
